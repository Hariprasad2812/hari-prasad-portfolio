<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - S. Hari Prasad</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF2A2A'/%3E%3Ctext x='32' y='45' font-family='Arial Black,Arial' font-size='34' font-weight='900' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root{--red:#FF2A2A;--black:#0A0A0A;--off-white:#F4F4F4;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    background:var(--black);color:var(--off-white);
    font-family:'Inter',sans-serif;padding:32px;text-align:center;
  }
  .code{font-family:'JetBrains Mono',monospace;font-size:clamp(80px,20vw,160px);color:var(--red);line-height:1;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,4vw,36px);margin:16px 0 12px;}
  p{color:rgba(255,255,255,0.6);max-width:420px;margin:0 auto 32px;line-height:1.6;}
  a{
    display:inline-block;padding:14px 28px;border-radius:999px;
    background:#fff;color:#0a0a0a;font-weight:600;font-size:14px;text-decoration:none;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  a:hover{transform:scale(1.05);box-shadow:0 8px 30px rgba(255,255,255,0.15);}
  a:focus-visible{outline:2px solid var(--red);outline-offset:3px;}
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Looks like you've reached the wrong endpoint.</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html">Back to Portfolio</a>
  </div>
</body>
</html>
